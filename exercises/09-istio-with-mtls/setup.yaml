apiVersion: v1
kind: Pod
metadata:
  name: pod1
  namespace: istio-test
  labels:
    app: pod1
    version: v1
spec:
  containers:
  - name: httpbin
    image: docker.io/kennethreitz/httpbin
    ports:
    - containerPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: pod2
  namespace: istio-test
  labels:
    app: pod2
spec:
  containers:
  - name: sleep
    image: curlimages/curl
    command: ["/bin/sleep", "3650d"]
---
apiVersion: v1
kind: Service
metadata:
  name: pod1-svc
  namespace: istio-test
spec:
  selector:
    app: pod1
  ports:
  - port: 80
    targetPort: 80