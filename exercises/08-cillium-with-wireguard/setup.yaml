apiVersion: v1
kind: Namespace
metadata:
  name: encryption-test
---
apiVersion: v1
kind: Pod
metadata:
  name: pod1
  namespace: encryption-test
  labels:
    app: pod1
spec:
  nodeSelector:
    node-role: node1
  containers:
  - name: web
    image: nginx:alpine
    ports:
    - containerPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: pod2
  namespace: encryption-test
  labels:
    app: pod2
spec:
  nodeSelector:
    node-role: node2
  containers:
  - name: client
    image: nicolaka/netshoot
    command: ["/bin/bash"]
    args: ["-c", "sleep 3600"]